<!DOCTYPE html>
<html lang="en">
<head>
  <title>Settings</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- https://github.com/luncheon/lch-color-wheel/ -->
  <script src="vendor/lch-color-wheel.js"></script>

  <!-- https://github.com/virtualvivek/windows-ui -->
  <link rel="stylesheet" href="vendor/winui-icons.min.css" />
  <link rel="stylesheet" href="vendor/windows-ui.min.css" />
  
  <link rel="stylesheet" href="settings.css" />
</head>

<body>
  <!-- ── Title bar (WebViewGui non-client region) ─────────── -->
  <div class="settings-titlebar draggable">
    <span class="title-text" id="titleText">Settings</span>

    <button class="app-btn app-btn-primary no-drag" data-action="save-settings"><span>Save</span></button>
    <button class="title-btn no-drag" data-action="minimize-window">&#xE921;</button>
    <button class="title-btn title-btn-close no-drag" data-action="close-settings">&#xE8BB;</button>
  </div>

  <div class="settings-container">
    <!-- ── Left nav ─────────────────────────────────────────────── -->
    <div class="settings-nav">
      <button class="nav-item active" data-section="general">
        <i class="icons10-settings"></i>
        <span>General</span>
      </button>
      <button class="nav-item" data-section="plugins">
        <i class="icons10-puzzle"></i>
        <span>Plugins</span>
      </button>
      <button class="nav-item" data-section="hotkeys">
        <i class="icons10-keyboard"></i>
        <span>Hotkeys</span>
      </button>
      <button class="nav-item" data-section="logs">
        <i class="icons10-list"></i>
        <span>Logs</span>
      </button>
    </div>

    <!-- ── Content ──────────────────────────────────────────────── -->
    <div class="settings-content">

      <!-- ═══ GENERAL ═══════════════════════════════════════════ -->
      <div id="section-general" class="settings-section active">
        <div class="setting-group">
          <h2>General</h2>
          <p class="subtitle">Loading settings schema...</p>
        </div>
      </div>

      <!-- ═══ PLUGINS ═══════════════════════════════════════════ -->
      <div id="section-plugins" class="settings-section">
        <div class="setting-group">
          <h2>Plugins</h2>
          <p class="subtitle">Enable or disable plugins. Changes require app reload.</p>
          <div id="plugins-list">
            <!-- dynamically populated from AHK -->
          </div>
        </div>

       
      </div>

      <!-- ═══ HOTKEYS ═══════════════════════════════════════════ -->
      <div id="section-hotkeys" class="settings-section">
        <div class="setting-group">
          <!-- <h2>Hotkey Assignments</h2>
          <p class="subtitle">Current hotkey bindings. Edit config.ini for advanced changes.</p> -->
          <div class="hotkeys-wrap">
            <div class="app-table-view-container">
              <table class="app-table-view">
                <thead>
                  <tr>
                    <th align="left" class="hotkey-col">Hotkey</th>
                    <th align="left">Action</th>
                  </tr>
                </thead>
                <tbody id="hotkeys-tbody">
                  <!-- dynamically populated from AHK -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- ═══ LOGS ══════════════════════════════════════════════ -->
      <div id="section-logs" class="settings-section section-console">
        <div class="setting-group">
          <h2>Logs</h2>
          <div class="logs-toolbar" id="logs-toolbar">
            <input type="text" id="logs-search" class="app-input-text logs-search-input" placeholder="Search logs..." autocomplete="off" />
            <div class="logs-filter-wrap">
              <button type="button" id="logs-filter-btn" class="app-btn app-btn-subtle">All levels ▾</button>
              <div id="logs-filter-dropdown" class="logs-filter-dropdown">
                <label><input type="checkbox" data-level="0" checked /> <span class="log-level-badge log-level-error">ERROR</span></label>
                <label><input type="checkbox" data-level="1" checked /> <span class="log-level-badge log-level-warning">WARNING</span></label>
                <label><input type="checkbox" data-level="2" checked /> <span class="log-level-badge log-level-notice">NOTICE</span></label>
                <label><input type="checkbox" data-level="3" checked /> <span class="log-level-badge log-level-info">INFO</span></label>
                <label><input type="checkbox" data-level="4" checked /> <span class="log-level-badge log-level-debug">DEBUG</span></label>
              </div>
            </div>
            <label class="logs-toggle-label">
              <input type="checkbox" id="logs-show-time" /> Show time
            </label>
          </div>
          <div id="logs-content" class="console-box logs-container">No logs yet.</div>
          <div class="bottom-toolbar">
            <button type="button" id="open-dev-tools" class="app-btn app-btn-subtle field-btn"><span>Open DevTools</span></button>
            <button type="button" id="logs-clear" class="app-btn app-btn-outline-danger">Clear</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="app-dialog" id="ColorPickerDialog" data-win-toggle="modal" data-win-target="#ColorPickerDialog" tabindex="-1">
    <div class="app-dialog-modal" aria-modal="true" role="dialog">
      <div class="app-dialog-body">
        <div class="color-picker-dialog-layout">
          <div id="my-color-picker-container" class="color-picker-container"></div>
          <div class="color-picker-side">
            <div id="DialogColorPreview" class="color-swatch-large" aria-hidden="true"></div>
            <div class="dialog-form-grid">
              <label class="color-field">
                <span>AHK Hex</span>
                <input class="app-input-text" type="text" id="DialogColorHex" placeholder="0xRRGGBB" />
              </label>
              <label class="color-field">
                <span>RGB</span>
                <input class="app-input-text" type="text" id="DialogColorRgb" readonly />
              </label>
              <label class="color-field">
                <span>LCH</span>
                <input class="app-input-text" type="text" id="DialogColorLch" readonly />
              </label>
            </div>
          </div>
        </div>
      </div>
      <div class="app-dialog-footer">
        <button class="app-btn" type="button" id="cancelColorPicker" data-win-toggle="modal" data-win-target="#ColorPickerDialog"><span>Cancel</span></button>
        <button class="app-btn app-btn-primary" type="button" id="applyColorPicker"><span>Apply</span></button>
      </div>
    </div>
  </div>

  <div class="app-dialog" id="HotkeyRecorderDialog" data-win-toggle="modal" data-win-target="#HotkeyRecorderDialog" tabindex="-1">
    <div class="app-dialog-modal" aria-modal="true" role="dialog">
      <div class="app-dialog-header">
        <h3 id="hotkeyDialogTitle">Record Hotkey</h3>
      </div>
      <div class="app-dialog-body">
        <div class="switch-row">
          <label class="app-switch">
            <input type="checkbox" id="hotkeyOptWildcard" />
            <div class="app-switch-view"></div>
            <span class="app-switch-label" data-on="On" data-off="Off"></span>
          </label>
          <span>Wildcard (*)</span>

          <label class="app-switch">
            <input type="checkbox" id="hotkeyOptPassthrough" />
            <div class="app-switch-view"></div>
            <span class="app-switch-label" data-on="On" data-off="Off"></span>
          </label>
          <span>Passthrough (~)</span>
        </div>
        <div class="hotkey-recorder-state">
          <div><strong>Status:</strong><span id="hotkeyRecordStatus">Waiting to start recording...</span></div>
          <div><strong>Hotkey:</strong><span id="hotkeyRecordReadable">(none)</span></div>
        </div>
      </div>
      <div class="app-dialog-footer">
        <button class="app-btn" type="button" id="cancel-hotkey-record" data-win-toggle="modal" data-win-target="#HotkeyRecorderDialog"><span>Cancel</span></button>
        <button class="app-btn app-btn-primary" type="button" id="apply-hotkey-record"><span>Apply</span></button>
      </div>
    </div>
  </div>

  
  <script src="classes/hotkeyUtils.js"></script>
  <script src="classes/SettingsFormSerializer.js"></script>
  <script src="classes/AhkHostBridge.js"></script>
  <script src="classes/LogsController.js"></script>
  <script src="classes/HotkeyRecorderController.js"></script>
  <script src="classes/ColorPickerController.js"></script>
  <script src="classes/SettingsFormRenderer.js"></script>
  <script src="classes/SettingsFormPluginPagesRenderer.js"></script>
  <script src="classes/SettingsFormActionsRenderer.js"></script>
  <script src="classes/SettingsForm.js"></script>
  <script src="pages/SettingsPage.js"></script>
  <script src="app.js"></script>
  
  <script src="vendor/windows-ui.min.js"></script>
  
</body>
</html>
